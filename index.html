<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>产业链行情情报站</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1d1d1f;--mut:#6e6e73;--ln:#e3e1da;--up:#d6303a;--dn:#1a9a5a;--ac:#1f4e79}
@media(prefers-color-scheme:dark){:root{--bg:#121315;--card:#1c1d20;--fg:#ececec;--mut:#9a9aa0;--ln:#2c2d31;--ac:#7fb0e0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;padding-bottom:40px}
header{padding:14px 16px 6px;padding-top:max(14px,env(safe-area-inset-top))}h1{font-size:19px;margin:0;letter-spacing:.5px}.sub{color:var(--mut);font-size:12px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--ln);overflow-x:auto}
nav button,.seg button{border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:16px;padding:5px 12px;font-size:13px;white-space:nowrap}
nav button.on,.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:10px 12px}.seg{display:flex;gap:6px;margin:4px 0 10px}
.lvl{font-size:12px;color:var(--mut);margin:12px 2px 6px;font-weight:600;letter-spacing:2px}.lvl:after{content:" ↓"}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.node{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;border-left:4px solid var(--mut)}
.node b{font-size:15px}.row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:3px}
.big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}td,th{padding:5px 3px;border-bottom:1px solid var(--ln);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:12px}
.news{padding:9px 0;border-bottom:1px solid var(--ln)}.news a{color:var(--fg);text-decoration:none}.meta{font-size:11px;color:var(--mut);margin-top:3px}
.tg{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:var(--ln);margin-right:4px}.t利好{background:#d6303a22;color:var(--up)}.t利空{background:#1a9a5a22;color:var(--dn)}
#sheet{position:fixed;inset:0;background:#0007;display:none;z-index:9;align-items:flex-end}#sheet>div{background:var(--bg);width:100%;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}
.chart{height:220px}.sm{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sm .chart{height:130px}
footer{color:var(--mut);font-size:11px;padding:12px 16px}
</style></head><body>
<header><h1>产业链行情情报站 <span class="sub">DEMO</span></h1><div class="sub" id="dt"></div></header>
<nav><button data-t="map" class="on">产业链图谱</button><button data-t="heat">热力图</button><button data-t="ind">关键指标</button><button data-t="news">新闻公告流</button></nav>
<main id="m"></main>
<div id="sheet" onclick="if(event.target===this)this.style.display='none'"><div id="sh"></div></div>
<footer>数据：Tushare 日线/每日指标/个股资金流，AKShare（新浪期货、财联社电报、东方财富个股新闻）。节点涨跌为代表股等权平均；主力净流入=大单+特大单净买入。新闻按关键词自动打标，利好/利空为简单规则，仅供参考。本站为个人研究演示，不构成投资建议。</footer>
<script>
let C,N,I,tab='map',chain='AI算力';const $=s=>document.querySelector(s);
const f=(v,s='%')=>v==null?'—':`<span class="${v>0?'up':v<0?'dn':''}">${v>0?'+':''}${v.toFixed(2)}${s}</span>`;
const col=v=>v==null?'#888':v>0?`rgba(214,48,58,${Math.min(1,.25+v/6)})`:`rgba(26,154,90,${Math.min(1,.25-v/6)})`;
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
Promise.all(['chains','news','indicators'].map(n=>fetch(`data/${n}.json?`+Date.now()).then(r=>r.json()))).then(([a,b,c])=>{C=a;N=b;I=c;
 const d=C.date;$('#dt').textContent=`数据日期 ${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)} 收盘 · 2 条链 · ${N.items.length} 条新闻`;render()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
function seg(){return `<div class="seg">${Object.keys(C.chains).map(c=>`<button class="${c===chain?'on':''}" onclick="chain='${c}';render()">${c}</button>`).join('')}</div>`}
function render(){const m=$('#m');echarts.getInstanceByDom&&document.querySelectorAll('.chart').forEach(e=>echarts.getInstanceByDom(e)?.dispose());
 if(tab==='map'){let h=seg(),nodes=C.chains[chain];
  ['上游','中游','下游'].forEach(l=>{const ns=nodes.filter(n=>n.level===l);if(!ns.length)return;h+=`<div class="lvl">${l}</div><div class="grid">`+
   ns.map(n=>`<div class="node" style="border-left-color:${col(n.d1)}" onclick="detail('${n.node}')"><b>${n.node}</b><div class="big">${f(n.d1)}</div>
   <div class="row"><span>5日 ${f(n.d5)}</span><span>20日 ${f(n.d20)}</span></div><div class="row"><span>主力 ${f(n.mf,'亿')}</span><span>新闻 ${n.news}</span></div></div>`).join('')+'</div>'});
  m.innerHTML=h+'<div class="sub" style="margin-top:8px">点节点看代表股与相关新闻</div>'}
 if(tab==='heat'){m.innerHTML=seg()+'<div class="card"><div id="tm" style="height:560px"></div></div><div class="sub">面积=总市值，颜色=当日涨跌</div>';
  const data=C.chains[chain].map(n=>({name:n.node,children:n.stocks.map(s=>({name:s.name,value:s.mv||1,d1:s.d1,itemStyle:{color:col(s.d1)}}))}));
  echarts.init($('#tm')).setOption({series:[{type:'treemap',data,roam:false,nodeClick:false,breadcrumb:{show:false},width:'100%',height:'100%',
   upperLabel:{show:true,height:20,color:dark?'#eee':'#333',fontWeight:'bold'},itemStyle:{borderColor:dark?'#121315':'#f6f5f1',borderWidth:1,gapWidth:1},
   levels:[{itemStyle:{borderWidth:3,gapWidth:3,borderColor:dark?'#121315':'#f6f5f1'}},{}],
   label:{formatter:p=>`${p.name}\n${p.data.d1>0?'+':''}${p.data.d1?.toFixed(2)}%`,color:'#fff',fontSize:11}}]})}
 if(tab==='ind'){m.innerHTML=`<div class="card"><b>沪铜主连 CU0</b> <span class="sub">新浪期货 · 近120日 · 最新 ${I.cu0.at(-1)[0]} ${(+I.cu0.at(-1)[1]).toLocaleString()} 元/吨</span><div class="chart" id="cu"></div></div>
  <div class="card"><b>链条 ETF 代理</b> <span class="sub">收盘价，5月以来</span><div class="sm">${Object.keys(I.etf).map((k,i)=>`<div><div class="sub">${k} ${pct(I.etf[k])}</div><div class="chart" id="e${i}"></div></div>`).join('')}</div></div>
  <div class="card sub">台积电月营收（MOPS）：本版未接入，待下一版解析后补上。HBM/DRAM 现货价、LME 与库存同样待补。</div>`;
  line('cu',I.cu0.map(x=>x[0]),I.cu0.map(x=>+x[1]),true);Object.values(I.etf).forEach((v,i)=>line('e'+i,v.map(x=>x[0]),v.map(x=>x[1])))}
 if(tab==='news'){window.nf=window.nf||'全部';const opts=['全部','AI算力','铜','利好','利空'];
  const it=N.items.filter(x=>x.tags.length&&(nf==='全部'||x.tone===nf||x.tags.some(t=>t[0]===nf)));
  m.innerHTML=`<div class="seg">${opts.map(o=>`<button class="${o===nf?'on':''}" onclick="nf='${o}';render()">${o}</button>`).join('')}</div><div class="card">${it.slice(0,120).map(nh).join('')||'暂无'}</div>
  <div class="sub">仅显示已匹配到链/节点的条目（${it.length}条）。点标题跳原文。</div>`}}
function pct(v){const a=v[0][1],b=v.at(-1)[1];return f((b/a-1)*100)}
function nh(x){return `<div class="news"><a href="${x.url}" target="_blank" rel="noopener">${x.title}</a><div class="meta">${x.tags.slice(0,3).map(t=>`<span class="tg">${t[1]}</span>`).join('')}${x.tone!=='中性'?`<span class="tg t${x.tone}">${x.tone}</span>`:''} ${x.time.slice(5,16)} · ${x.src}${x.stock?' · '+x.stock:''}</div></div>`}
function line(id,x,y,axis){echarts.init(document.getElementById(id)).setOption({grid:{l:axis?50:4,left:axis?52:4,right:6,top:8,bottom:axis?22:4},tooltip:{trigger:'axis'},
 xAxis:{type:'category',data:x,show:!!axis,axisLabel:{color:'#888',fontSize:10}},yAxis:{type:'value',scale:true,show:!!axis,axisLabel:{color:'#888',fontSize:10},splitLine:{lineStyle:{color:dark?'#2c2d31':'#eee'}}},
 series:[{type:'line',data:y,showSymbol:false,lineStyle:{width:1.6,color:dark?'#7fb0e0':'#1f4e79'},areaStyle:{opacity:.08}}]})}
function detail(nd){const n=C.chains[chain].find(x=>x.node===nd);const nw=N.items.filter(x=>x.tags.some(t=>t[0]===chain&&t[1]===nd));
 $('#sh').innerHTML=`<b style="font-size:17px">${chain} · ${nd}</b> <span class="sub">${n.level}</span><table><tr><th>代表股</th><th>收盘</th><th>1日</th><th>5日</th><th>20日</th><th>主力亿</th></tr>
 ${n.stocks.map(s=>`<tr><td>${s.name}<div class="sub">${s.code}</div></td><td>${s.close}</td><td>${f(s.d1,'')}</td><td>${f(s.d5,'')}</td><td>${f(s.d20,'')}</td><td>${f(s.mf,'')}</td></tr>`).join('')}</table>
 <div class="lvl" style="letter-spacing:0">相关新闻 ${nw.length}</div>${nw.slice(0,30).map(nh).join('')||'<div class="sub">暂无</div>'}`;$('#sheet').style.display='flex'}
</script></body></html>
